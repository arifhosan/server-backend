# Included in every location: add_header in a location discards the ones
# inherited from the server block.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://cdn.cloudflare.steamstatic.com https://image.api.playstation.com data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;
