services:
  app:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DB_HOST: database
      DB_PORT: 3306
      # The app reads DB_USERNAME; this was DB_USER, so the container could
      # never authenticate against the database.
      DB_USERNAME: ${DB_USERNAME:-backend}
      DB_PASSWORD: ${DB_PASSWORD:-your_password}
      DB_NAME: ${DB_NAME:-api_db}
      DB_SYNC: ${DB_SYNC:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-api_db}
      MYSQL_USER: ${DB_USERNAME:-backend}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_password}
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
