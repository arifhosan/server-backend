name: Build and Push ARM64 to GHCR

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Kept in step with the Volta pin in package.json. Nest 12 is ESM
          # only, so Node must support require(esm).
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    # Do not publish an image that does not compile or pass its tests.
    needs: test
    runs-on: ubuntu-latest

    # Actions mints this token per run, so there is no PAT to expire. It can
    # only write to packages this repository has access to.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Matches the repository name, so GHCR links the package to this
          # repo on first push and GITHUB_TOKEN can write to it.
          tags: ghcr.io/arifhosan/server-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
